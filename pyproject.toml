[project]
name = "psyclaw"
version = "0.1.0"
description = "An open-source mental health AI agent built with Google ADK and LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139,<0.140",
    "google-adk>=2.5.0,<3.0.0",
    "litellm>=1.80,<1.82.7",
    "python-dotenv",
]

[project.scripts]
psyclaw = "psyclaw.launcher:main"
psyclaw-server = "psyclaw.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psyclaw"]

[tool.hatch.build]
exclude = [
    "/psyclaw/.adk",
    "/psyclaw/.env",
    "/psyclaw/patient",
]
