[project]
name = "psyclaw"
version = "0.1.0"
description = "Simple ADK agent using Mistral through LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139,<0.140",
    "google-adk>=2.5.0,<3.0.0",
    "litellm>=1.80,<1.82.7",
    "python-dotenv",
]

[project.scripts]
psyclaw-adk-web = "psyclaw.adk_web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psyclaw"]

[tool.hatch.build]
exclude = [
    "/psyclaw/.adk",
    "/psyclaw/.env",
    "/psyclaw/patient",
]
